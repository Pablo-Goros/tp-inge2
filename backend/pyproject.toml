[project]
name = "certs-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "pika==1.4.4",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.2",
  "bcrypt==5.0.0",
  "pyjwt==2.15.1",
  "python-multipart==0.0.33",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
