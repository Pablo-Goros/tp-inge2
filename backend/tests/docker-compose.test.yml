# Infra de pruebas: docker compose -f backend/tests/docker-compose.test.yml up -d --wait
name: frente-b-test
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: certs
      POSTGRES_PASSWORD: certs
      POSTGRES_DB: certs
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certs -d certs"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1.4-alpine
    ports: ["55672:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
